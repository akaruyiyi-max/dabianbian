services:
  # 答辩记录仪 - Render 部署配置
  # 部署步骤：
  #   1. 把本项目推到 GitHub
  #   2. 打开 https://dashboard.render.com/blueprints 点击 "New Blueprint Instance"
  #   3. 连接你的 GitHub 仓库，Render 会自动按本文件创建服务
  #   4. 创建时在环境变量里填好 JWT_SECRET（或保留 generateValue 自动生成）
  - type: web
    name: daibiandengjiqi
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/app.db
      - key: JWT_SECRET
        generateValue: true
    # 注意：Render 免费版不支持挂载磁盘(disk)，数据库只能写在实例本地文件系统。
    # 实例休眠/重启时本地文件会被重置，如需数据永久持久，二选一：
    #   (A) 升级 Starter 付费实例(约 $7/月)即可挂载磁盘；或
    #   (B) 接入外部免费 Postgres(Neon / Supabase)替换 SQLite 存储层。
