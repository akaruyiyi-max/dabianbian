<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFC8DD"/>
      <stop offset="60%" stop-color="#FFA0B4"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4D0"/>
      <stop offset="100%" stop-color="#FFCBA4"/>
    </radialGradient>
  </defs>
  <ellipse cx="75" cy="185" rx="14" ry="8" fill="#FF8FA3"/>
  <ellipse cx="125" cy="185" rx="14" ry="8" fill="#FF8FA3"/>
  <ellipse cx="100" cy="110" rx="65" ry="70" fill="url(#bodyGrad)"/>
  <ellipse cx="100" cy="125" rx="42" ry="45" fill="#FFD4E5" opacity="0.6"/>
  <!-- right arm waving -->
  <ellipse cx="172" cy="75" rx="12" ry="24" fill="#FFA0B4" transform="rotate(55 172 75)"/>
  <!-- left arm normal -->
  <ellipse cx="38" cy="115" rx="12" ry="22" fill="#FFA0B4" transform="rotate(-20 38 115)"/>
  <ellipse cx="100" cy="85" rx="48" ry="42" fill="url(#faceGrad)"/>
  <circle cx="70" cy="95" r="12" fill="#FF6B9D" opacity="0.4"/>
  <circle cx="130" cy="95" r="12" fill="#FF6B9D" opacity="0.4"/>
  <!-- happy greeting eyes -->
  <path d="M 76 78 Q 82 70 88 78" stroke="#2A1A2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 112 78 Q 118 70 124 78" stroke="#2A1A2A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- welcoming smile -->
  <path d="M 85 100 Q 100 112 115 100" stroke="#E8344E" stroke-width="3.5" fill="#FF4D6A" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 95 48 Q 100 33 105 48 Q 103 40 100 37 Q 97 40 95 48" fill="#FF8FA3"/>
  <!-- motion lines for waving -->
  <path d="M 180 55 L 188 50" stroke="#FFA0B4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 183 68 L 192 68" stroke="#FFA0B4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 178 80 L 186 84" stroke="#FFA0B4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
