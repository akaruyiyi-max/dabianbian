<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFC8DD"/>
      <stop offset="60%" stop-color="#FFA0B4"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4D0"/>
      <stop offset="100%" stop-color="#FFCBA4"/>
    </radialGradient>
  </defs>
  <!-- feet -->
  <ellipse cx="75" cy="185" rx="14" ry="8" fill="#FF8FA3"/>
  <ellipse cx="125" cy="185" rx="14" ry="8" fill="#FF8FA3"/>
  <!-- body -->
  <ellipse cx="100" cy="110" rx="65" ry="70" fill="url(#bodyGrad)"/>
  <!-- belly -->
  <ellipse cx="100" cy="125" rx="42" ry="45" fill="#FFD4E5" opacity="0.6"/>
  <!-- arms -->
  <ellipse cx="38" cy="115" rx="12" ry="22" fill="#FFA0B4" transform="rotate(-20 38 115)"/>
  <ellipse cx="162" cy="115" rx="12" ry="22" fill="#FFA0B4" transform="rotate(20 162 115)"/>
  <!-- face area -->
  <ellipse cx="100" cy="85" rx="48" ry="42" fill="url(#faceGrad)"/>
  <!-- blush -->
  <circle cx="70" cy="95" r="10" fill="#FF6B9D" opacity="0.35"/>
  <circle cx="130" cy="95" r="10" fill="#FF6B9D" opacity="0.35"/>
  <!-- eyes -->
  <ellipse cx="82" cy="78" rx="5" ry="7" fill="#2A1A2A"/>
  <ellipse cx="118" cy="78" rx="5" ry="7" fill="#2A1A2A"/>
  <circle cx="83.5" cy="75.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="119.5" cy="75.5" r="1.8" fill="#FFFFFF"/>
  <!-- mouth - sausage style -->
  <ellipse cx="100" cy="100" rx="12" ry="5" fill="#E8344E"/>
  <ellipse cx="100" cy="98" rx="10" ry="3" fill="#FF4D6A"/>
  <!-- top tuft -->
  <path d="M 95 45 Q 100 30 105 45 Q 103 38 100 35 Q 97 38 95 45" fill="#FF8FA3"/>
</svg>
